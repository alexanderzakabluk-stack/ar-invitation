<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Film render</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../src/three-compat.js",
    "three-core": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { createExperience } from "../src/scene.js";

const W = 1080;
const H = 1350;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(2);          // supersample — free offline, impossible on a phone
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.style.width = W + "px";
renderer.domElement.style.height = H + "px";
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070605);

const camera = new THREE.PerspectiveCamera(34, W / H, 0.01, 40);

const experience = createExperience(renderer, { shadows: true });
scene.add(experience.root);

/* A dark reflective tabletop: the scene needs something under it, and a hard
   cut to black is exactly what made the phone version look like it floated. */
const table = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 4),
  new THREE.MeshStandardMaterial({ color: 0x0b0908, roughness: 0.42, metalness: 0.3 })
);
table.rotation.x = -Math.PI / 2;
table.position.y = -0.0015;
table.receiveShadow = true;
scene.add(table);

const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));

// Bloom only on the real highlights — the sparkles, the copper rim, the wet
// pearls. A low threshold would fog the whole frame.
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.2, 0.45, 0.94));

const bokeh = new BokehPass(scene, camera, { focus: 1.05, aperture: 0.00022, maxblur: 0.01 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

/** Deterministic playback so a frame can be requested by time, not by waiting. */
function seek(seconds) {
  experience.play();
  const step = 1 / 60;
  for (let t = 0; t < seconds; t += step) experience.update(step, camera);
}

function frame(seconds, orbit = 0.55) {
  const r = 1.05;
  camera.position.set(Math.sin(orbit) * r, 0.42, Math.cos(orbit) * r);
  camera.lookAt(0, 0.17, 0);
  camera.updateMatrixWorld();
  seek(seconds);
  composer.render();
}

window.__frame = frame;
window.__ready = false;

document.fonts.ready.then(() => {
  frame(8);
  window.__ready = true;
});
</script>
</body>
</html>
